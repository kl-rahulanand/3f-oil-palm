services:
  app-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PGDATABASE:-threef}
      POSTGRES_USER: ${PGUSER:-threef}
      POSTGRES_PASSWORD: ${PGPASSWORD:-3f-local}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  warehouse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse-local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse"]
      interval: 2s
      timeout: 5s
      retries: 15

  warehouse-seed:
    image: postgres:16-alpine
    depends_on:
      warehouse-db:
        condition: service_healthy
    environment:
      PGPASSWORD: warehouse-local
    command:
      - psql
      - --host=warehouse-db
      - --username=warehouse
      - --dbname=warehouse
      - --command=CREATE TABLE IF NOT EXISTS WarehouseFixture (id integer PRIMARY KEY, value numeric NOT NULL); INSERT INTO WarehouseFixture (id, value) VALUES (1, 42) ON CONFLICT (id) DO UPDATE SET value = EXCLUDED.value;
    restart: "no"

volumes:
  app-db-data:
  warehouse-data:
